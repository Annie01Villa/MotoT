<title>Pantallas CRM-MotoT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Visor: menú lateral fijo a la izquierda, escenario con la pantalla a la derecha. Sistema ocre del CRM. */
:root{
  --acc:#C25A12; --acc-h:#A84B0C; --acc-s:#FDF3EA;
  --bg:#FAFAF9; --side:#F5F5F4; --sf:#FFFFFF; --bd:#E7E5E4; --hov:#EEEDEC;
  --t1:#1C1917; --t2:#57534E; --t3:#78716C; --stage:#E7E5E4;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --acc:#E07A33; --acc-h:#EB8F4E; --acc-s:#3A2516;
  --bg:#1C1917; --side:#171412; --sf:#292524; --bd:#3A3532; --hov:#2E2926;
  --t1:#F5F5F4; --t2:#C9C4C0; --t3:#A8A29E; --stage:#0F0D0C; color-scheme:dark}}
:root[data-theme="dark"]{
  --acc:#E07A33; --acc-h:#EB8F4E; --acc-s:#3A2516;
  --bg:#1C1917; --side:#171412; --sf:#292524; --bd:#3A3532; --hov:#2E2926;
  --t1:#F5F5F4; --t2:#C9C4C0; --t3:#A8A29E; --stage:#0F0D0C; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--f);font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font-family:inherit}
.app{display:flex;height:100%;min-height:0}

/* Menú lateral */
.menu{width:288px;flex-shrink:0;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.marca{display:flex;align-items:center;gap:8px;padding:20px 20px 4px max(20px,env(safe-area-inset-left,0px));font-weight:600;font-size:16px;line-height:24px}
.marca svg{color:var(--acc)}
.sub{padding:0 20px 16px max(20px,env(safe-area-inset-left,0px));color:var(--t3);font-size:13px}
.lista{overflow-y:auto;flex:1;padding:0 12px 24px max(12px,env(safe-area-inset-left,0px))}
details{border-top:1px solid var(--bd)}
details:first-child{border-top:0}
summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:8px;border-radius:6px;cursor:pointer;font-weight:600;user-select:none}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--hov)}
summary .chev{width:16px;height:16px;transition:transform .15s;color:var(--t3)}
details[open] summary .chev{transform:rotate(90deg)}
summary .cuenta{margin-left:auto;color:var(--t3);font-weight:500;font-size:12px;font-variant-numeric:tabular-nums}
.items{display:flex;flex-direction:column;gap:2px;padding:0 0 8px}
.item{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;color:var(--t2);padding:8px 8px 8px 32px;border-radius:6px;cursor:pointer;font-size:13px;line-height:18px}
.item:hover{background:var(--hov);color:var(--t1)}
.item .n{color:var(--t3);font-variant-numeric:tabular-nums;min-width:20px}
.item[aria-current="true"]{background:var(--acc-s);color:var(--t1);font-weight:500}
.item[aria-current="true"] .n{color:var(--acc)}
.item:focus-visible,summary:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* Escenario */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.barra{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px 20px;border-bottom:1px solid var(--bd);background:var(--sf)}
.titulo{min-width:0;flex:1}
.titulo .mod{color:var(--t3);font-size:12px;line-height:16px}
.titulo h1{margin:0;font-size:16px;line-height:24px;font-weight:600;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:6px;padding:2px;background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--t2);height:32px;padding:0 12px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--sf);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:disabled{opacity:.4;cursor:default}
.btn{display:none;border:1px solid var(--bd);background:var(--sf);color:var(--t1);height:36px;padding:0 12px;border-radius:6px;cursor:pointer;font-weight:500;align-items:center;gap:6px}
.nav{display:flex;gap:4px}
.nav button{width:36px;height:36px;border:1px solid var(--bd);background:var(--sf);color:var(--t2);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.nav button:hover{color:var(--t1);background:var(--hov)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.escenario{flex:1;min-height:0;overflow:auto;background:var(--stage);padding:24px max(24px,env(safe-area-inset-right,0px)) 24px 24px}
.marco{margin:0 auto;position:relative;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08);border-radius:4px;overflow:hidden}
.marco.cel{border-radius:20px}
.marco iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:transparent}
.medida{text-align:center;color:var(--t3);font-size:12px;margin-top:12px;font-variant-numeric:tabular-nums}
.velo{display:none}

@media (max-width:820px){
  .menu{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;width:min(320px,88vw);padding-top:env(safe-area-inset-top,0px)}
  .app.abierto .menu{transform:none}
  .app.abierto .velo{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
  .btn{display:inline-flex}
  .barra{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .titulo{flex-basis:100%;order:-1}
  .escenario{padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){.menu,summary .chev{transition:none}}
</style>

<div class="app" id="app">
  <aside class="menu" id="menu" aria-label="Pantallas">
    <div class="marca"><svg class="ic" style="width:20px;height:20px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>CRM-MotoT</div>
    <div class="sub" id="resumen"></div>
    <nav class="lista" id="lista"></nav>
  </aside>
  <div class="velo" id="velo"></div>
  <section class="main">
    <div class="barra">
      <button class="btn" id="abrir" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Pantallas</button>
      <div class="titulo"><div class="mod" id="mod"></div><h1 id="nombre"></h1></div>
      <div class="seg" role="group" aria-label="Tamaño">
        <button type="button" id="b-cel" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>Celular</button>
        <button type="button" id="b-pc" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Computadora</button>
      </div>
      <div class="seg" role="group" aria-label="Zoom">
        <button type="button" id="z-fit" aria-pressed="true">Ajustar</button>
        <button type="button" id="z-100" aria-pressed="false">100%</button>
      </div>
      <div class="seg" role="group" aria-label="Tema">
        <button type="button" id="t-claro" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Claro</button>
        <button type="button" id="t-oscuro" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Oscuro</button>
      </div>
      <div class="nav">
        <button type="button" id="ant" aria-label="Pantalla anterior"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button type="button" id="sig" aria-label="Pantalla siguiente"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    <div class="escenario" id="escenario">
      <div class="marco" id="marco"><iframe id="frame" title="Pantalla" sandbox="allow-scripts allow-same-origin"></iframe></div>
      <div class="medida" id="medida"></div>
    </div>
  </section>
</div>

<script type="application/json" id="datos">/*DATOS*/</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('datos').textContent);
  var plano = [];  // todas las pantallas en orden, para anterior/siguiente
  var porArchivo = {};
  D.secciones.forEach(function(s){
    s.pantallas.forEach(function(p){
      p.seccion = s; plano.push(p);
      ['cel','pc'].forEach(function(k){ if(p.vistas[k]) porArchivo[p.vistas[k].id] = {p:p, k:k}; });
    });
  });
  var $ = function(id){ return document.getElementById(id); };
  var guardado = {}; try { guardado = JSON.parse(localStorage.getItem('visor-motot') || '{}'); } catch(e) {}
  var oscuroSis = false; try { oscuroSis = matchMedia('(prefers-color-scheme: dark)').matches; } catch(e) {}
  var estado = { p: null, disp: guardado.disp || 'pc', zoom: guardado.zoom || 'fit', altoHoja: null,
    tema: guardado.tema || (oscuroSis ? 'oscuro' : 'claro') };

  // Menú
  var lista = $('lista'), botones = [];
  D.secciones.forEach(function(s, i){
    var det = document.createElement('details');
    det.dataset.sec = s.id;
    var sum = document.createElement('summary');
    sum.innerHTML = '<svg class="chev ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';
    sum.appendChild(document.createTextNode(s.nombre));
    var c = document.createElement('span'); c.className = 'cuenta'; c.textContent = s.pantallas.length; sum.appendChild(c);
    det.appendChild(sum);
    var items = document.createElement('div'); items.className = 'items';
    s.pantallas.forEach(function(p){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'item';
      if (p.num) { var n = document.createElement('span'); n.className = 'n'; n.textContent = p.num; b.appendChild(n); }
      var t = document.createElement('span'); t.textContent = p.nombre || s.nombre; b.appendChild(t);
      if (!p.vistas.pc || !p.vistas.cel) b.title = p.vistas.cel ? 'Solo celular' : 'Solo computadora';
      b.addEventListener('click', function(){ mostrar(p); $('app').classList.remove('abierto'); });
      p.boton = b; botones.push(b); items.appendChild(b);
    });
    det.appendChild(items); lista.appendChild(det);
  });
  var nPant = plano.filter(function(p){ return !p.hoja; }).length;
  $('resumen').textContent = nPant + ' pantallas en ' + (D.secciones.length - 1) + ' módulos';

  function guardar(){ try { localStorage.setItem('visor-motot', JSON.stringify({id: estado.p.vistas[vista()].id, disp: estado.disp, zoom: estado.zoom, tema: estado.tema})); } catch(e) {} }
  function vista(){ var p = estado.p; return p.vistas[estado.disp] ? estado.disp : (p.vistas.pc ? 'pc' : 'cel'); }

  function mostrar(p, disp){
    if (disp) estado.disp = disp;
    estado.p = p; estado.altoHoja = null;
    botones.forEach(function(b){ b.setAttribute('aria-current', b === p.boton ? 'true' : 'false'); });
    var det = p.boton.closest('details'); if (!det.open) det.open = true;
    p.boton.scrollIntoView({block:'nearest'});
    $('mod').textContent = p.seccion.nombre;
    $('nombre').textContent = (p.num ? p.num + ' · ' : '') + (p.nombre || p.seccion.nombre);
    var k = vista(), v = p.vistas[k];
    $('b-cel').disabled = !p.vistas.cel; $('b-pc').disabled = !p.vistas.pc;
    $('b-cel').setAttribute('aria-pressed', k === 'cel'); $('b-pc').setAttribute('aria-pressed', k === 'pc');
    var f = $('frame');
    f.style.width = v.w + 'px';
    f.srcdoc = (estado.tema === 'oscuro' && D.oscuro[v.id]) || D.docs[v.id];
    document.documentElement.setAttribute('data-theme', estado.tema === 'oscuro' ? 'dark' : 'light');
    $('t-claro').setAttribute('aria-pressed', estado.tema !== 'oscuro'); $('t-oscuro').setAttribute('aria-pressed', estado.tema === 'oscuro');
    $('t-oscuro').title = p.hoja ? 'Las hojas de referencia se muestran siempre en claro' : '';
    $('marco').className = 'marco' + (k === 'cel' ? ' cel' : '');
    escalar(); guardar();
  }

  function escalar(){
    if (!estado.p) return;
    var v = estado.p.vistas[vista()], hoja = !!estado.p.hoja;
    var h = hoja ? (estado.altoHoja || 1200) : v.h;
    var esc = $('escenario'), cs = getComputedStyle(esc);
    var aw = esc.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var ah = esc.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 32;
    var s = 1;
    if (estado.zoom === 'fit') s = Math.min(1, aw / v.w, hoja ? 1 : ah / h);
    s = Math.max(s, 0.1);
    var f = $('frame'); f.style.height = h + 'px'; f.style.transform = 'scale(' + s + ')';
    var m = $('marco'); m.style.width = Math.round(v.w * s) + 'px'; m.style.height = Math.round(h * s) + 'px';
    $('medida').textContent = v.w + ' × ' + (hoja ? 'hoja completa' : h) + ' px · ' + Math.round(s * 100) + '%';
    $('z-fit').setAttribute('aria-pressed', estado.zoom === 'fit'); $('z-100').setAttribute('aria-pressed', estado.zoom !== 'fit');
  }

  window.addEventListener('message', function(e){
    var d = e.data; if (!d || !d.visor) return;
    if (d.visor === 'ir') {
      var id = estado.p.seccion.id + '/' + d.archivo, r = porArchivo[id];
      if (r) mostrar(r.p, r.k);
    } else if (d.visor === 'alto' && estado.p && estado.p.hoja && d.h && d.h !== estado.altoHoja) {
      estado.altoHoja = d.h; escalar();
    }
  });
  window.addEventListener('resize', escalar);
  $('b-cel').addEventListener('click', function(){ mostrar(estado.p, 'cel'); });
  $('b-pc').addEventListener('click', function(){ mostrar(estado.p, 'pc'); });
  $('t-claro').addEventListener('click', function(){ estado.tema = 'claro'; mostrar(estado.p); });
  $('t-oscuro').addEventListener('click', function(){ estado.tema = 'oscuro'; mostrar(estado.p); });
  $('z-fit').addEventListener('click', function(){ estado.zoom = 'fit'; escalar(); guardar(); });
  $('z-100').addEventListener('click', function(){ estado.zoom = '100'; escalar(); guardar(); });
  function mover(d){ var i = plano.indexOf(estado.p); mostrar(plano[(i + d + plano.length) % plano.length]); }
  $('ant').addEventListener('click', function(){ mover(-1); });
  $('sig').addEventListener('click', function(){ mover(1); });
  document.addEventListener('keydown', function(e){
    if (e.target.closest && e.target.closest('input,textarea')) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { if (e.target.tagName !== 'SUMMARY') { e.preventDefault(); mover(1); } }
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { if (e.target.tagName !== 'SUMMARY') { e.preventDefault(); mover(-1); } }
  });
  $('abrir').addEventListener('click', function(){ $('app').classList.add('abierto'); });
  $('velo').addEventListener('click', function(){ $('app').classList.remove('abierto'); });

  var ini = porArchivo[guardado.id];
  mostrar(ini ? ini.p : plano[0], ini ? ini.k : null);
})();
</script>
