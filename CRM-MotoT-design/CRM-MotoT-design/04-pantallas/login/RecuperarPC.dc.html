<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app,.app *{box-sizing:border-box}
.app{font-family:'Inter',system-ui,-apple-system,sans-serif;color:#1C1917;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
.app h1,.app p{margin:0}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.logo .ic{color:#C25A12}
.lbl{display:block;margin-bottom:8px;font-weight:500}
.inp{display:block;width:100%;height:44px;margin:0;padding:0 12px;border:1px solid #D6D3D1;border-radius:6px;background:#FFFFFF;color:#1C1917;font-family:inherit;font-size:14px;line-height:20px}
.inp::placeholder{color:#78716C}
.inp:focus,.inp.foco{outline:none;border-color:#C25A12;box-shadow:0 0 0 3px #FDF3EA}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;padding:0 16px;border:0;border-radius:6px;background:#C25A12;color:#FFFFFF;font-family:inherit;font-size:14px;line-height:20px;font-weight:600;cursor:pointer}
.btn:hover{background:#A84B0C}
.lnk{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:#C25A12;font-weight:500;text-decoration:none}
.lnk:hover{color:#A84B0C;text-decoration:underline}
</style>
</helmet>
<div class="app" style="width: 1440px; height: 900px; background: #FAFAF9; display: flex; align-items: center; justify-content: center">
<main style="width: 400px; background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 8px; padding: 32px; display: flex; flex-direction: column; gap: 24px">
<div class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18.5" cy="17.5" r="3.5"></circle><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="15" cy="5" r="1"></circle><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg><span>CRM-MotoT</span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em">Recuperar contraseña</h1>
<p style="color: #57534E">Te enviaremos un enlace a tu correo para crear una contraseña nueva.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 16px">
<div>
<label class="lbl" for="correo">Correo</label>
<input class="inp foco" id="correo" type="email" autocomplete="email" placeholder="laura@ejemplo.com">
</div>
<button class="btn" type="submit" style="margin-top: 8px">Enviar enlace</button>
</form>
<div style="display: flex; justify-content: center; margin: -12px 0 -12px">
<a class="lnk" href="LoginPC.dc.html">Volver a entrar</a>
</div>
</main>
</div>
